name: Build Synology NAS Image

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_VERSION: 4.17.8

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download BaiduNetdisk deb package
        run: |
          set -e
          FILE_URL="https://issuepcdn.baidupcs.com/issue/netdisk/LinuxGuanjia/${APP_VERSION}/baidunetdisk_${APP_VERSION}_amd64.deb"
          for i in 1 2 3; do
            echo "Attempt $i: downloading baidunetdisk deb package..."
            if curl -fsSL --connect-timeout 30 --max-time 300 \
                -o "baidunetdisk_${APP_VERSION}_amd64.deb" \
                "$FILE_URL"; then
              echo "Download successful"
              ls -lh "baidunetdisk_${APP_VERSION}_amd64.deb"
              break
            fi
            echo "Download failed, retrying in 5s..."
            sleep 5
          done
          if [ ! -f "baidunetdisk_${APP_VERSION}_amd64.deb" ]; then
            echo "Failed to download deb package after 3 attempts"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=synology
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          echo "Image built and pushed successfully"
          echo "Tags:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:synology"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
